<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <title>Bibliothèque Audio</title>

    <style>
        body {
            background-color: #15171c;
            color: white;
            font-family: Arial, sans-serif;
            text-align: center;
            margin: 0;
            padding: 40px;
        }

        h1 {
            font-size: 45px;
        }

        p {
            color: #bbbbbb;
        }

        .bibliotheque {
            display: flex;
            justify-content: center;
            gap: 40px;
            margin-top: 60px;
        }

        .livre {
            background-color: #252832;
            width: 180px;
            height: 260px;
            border-radius: 15px;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            transition: 0.2s;
        }

        .livre:hover {
            transform: scale(1.08);
        }

        .emoji {
            font-size: 90px;
        }

        #message {
            margin-top: 50px;
            font-size: 20px;
        }
    </style>
</head>

<body>

    <h1>📚 Bibliothèque Audio</h1>

    <p>Clique sur un livre pour écouter un audio aléatoire.</p>

    <div class="bibliotheque">

        <div class="livre" onclick="lireAudio()">
            <div class="emoji">📕</div>
            <h2>Livre 1</h2>
        </div>

        <div class="livre" onclick="lireAudio()">
            <div class="emoji">📗</div>
            <h2>Livre 2</h2>
        </div>

        <div class="livre" onclick="lireAudio()">
            <div class="emoji">📘</div>
            <h2>Livre 3</h2>
        </div>

    </div>

    <div id="message">
        🔊 Aucun audio en cours
    </div>

    <script>

        const phrases = [
    "Il était une fois un jeune garçon qui trouva un vieux livre dans le grenier de sa maison. Lorsqu'il l'ouvrit, les mots commencèrent à briller. Soudain, une petite voix lui murmura : bienvenue dans l'histoire.",

    "Par une nuit d'orage, un chat noir se promenait seul dans une rue déserte. Il aperçut une étrange lumière derrière une porte abandonnée. Curieux, il entra et découvrit une bibliothèque remplie de livres capables de parler.",

    "Au fond d'une forêt immense se trouvait une maison que personne n'osait approcher. Un jour, une jeune aventurière décida d'y entrer. Sur une table, elle trouva un livre rouge. Dès qu'elle le toucha, la maison entière se mit à trembler.",

    "Un garçon se réveilla un matin et remarqua que tout le monde avait disparu. Les rues étaient vides, les voitures abandonnées et les magasins ouverts. Puis son téléphone sonna. Un message apparut : si tu veux retrouver les autres, trouve le livre bleu.",

    "Un vieux marin racontait qu'un trésor était caché sur une île perdue. Personne ne le croyait. Pourtant, un jour, trois enfants trouvèrent une carte dans un livre ancien. Au centre de la carte était écrit : ne faites confiance à personne."
];

        function lireAudio() {

            const nombreAleatoire =
                Math.floor(Math.random() * phrases.length);

            const phrase = phrases[nombreAleatoire];

            document.getElementById("message").textContent =
                "🔊 " + phrase;

            speechSynthesis.cancel();

            const voix = new SpeechSynthesisUtterance(phrase);

            voix.lang = "fr-FR";

            speechSynthesis.speak(voix);
        }

    </script>

</body>

</html>
