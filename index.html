<!DOCTYPE html>
<html lang="fr">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Empêche le navigateur de garder une vieille version -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">

    <title>Bookly</title>

    <style>

        body {
            margin: 0;
            background: #f7f7f9;
            font-family: Arial, sans-serif;
            color: #202020;
        }


        header {
            background: white;
            padding: 22px 8%;

            font-size: 26px;
            font-weight: bold;

            border-bottom: 1px solid #eeeeee;
        }


        main {
            max-width: 1100px;
            margin: auto;
            padding: 60px 20px;
        }


        .titre {
            text-align: center;
            margin-bottom: 50px;
        }


        .titre h1 {
            font-size: 48px;
            margin-bottom: 10px;
        }


        .titre p {
            color: #777777;
            font-size: 18px;
        }


        .livres {
            display: flex;
            justify-content: center;
            gap: 35px;
            flex-wrap: wrap;
        }


        .livre {
            background: white;

            width: 280px;

            padding: 18px;

            border-radius: 22px;

            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);

            cursor: pointer;

            transition: 0.25s;
        }


        .livre:hover {
            transform: translateY(-10px);
        }


        .livre img {
            width: 100%;
            height: 350px;

            object-fit: cover;

            border-radius: 15px;
        }


        .livre h2 {
            margin-bottom: 5px;
        }


        .livre p {
            color: #777777;
        }


        .lecteur {
            background: white;

            margin-top: 50px;

            padding: 30px;

            border-radius: 22px;

            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.06);
        }


        #histoire {
            line-height: 1.7;
            font-size: 18px;
        }


        button {
            margin-top: 20px;

            background: #202020;
            color: white;

            border: none;

            padding: 12px 20px;

            border-radius: 10px;

            cursor: pointer;

            font-size: 15px;
        }


        button:hover {
            opacity: 0.8;
        }

    </style>

</head>


<body>


<header>

    📚 Bookly

</header>


<main>


    <div class="titre">

        <h1>Choisis ton histoire</h1>

        <p>
            Clique sur un livre et découvre une histoire au hasard.
        </p>

    </div>



    <div class="livres">


        <div class="livre" onclick="lireHistoire()">

            <img src="livre1.jpg">

            <h2>Mystère</h2>

            <p>
                Des histoires mystérieuses...
            </p>

        </div>



        <div class="livre" onclick="lireHistoire()">

            <img src="livre2.jpg">

            <h2>Aventure</h2>

            <p>
                Pars à l'aventure !
            </p>

        </div>



        <div class="livre" onclick="lireHistoire()">

            <img src="livre3.jpg">

            <h2>Fantastique</h2>

            <p>
                Découvre des mondes étranges.
            </p>

        </div>


    </div>



    <div class="lecteur">

        <h2>🎧 Ton histoire</h2>

        <div id="histoire">
            Clique sur un livre pour commencer.
        </div>

        <button onclick="arreter()">
            ⏹ Arrêter l'audio
        </button>

    </div>


</main>



<script>


    const histoires = [

        "Une nuit, Tom découvrit une vieille porte cachée derrière sa bibliothèque. Il l'ouvrit et aperçut un escalier qui descendait sous sa maison. Tout au fond brillait une étrange lumière bleue.",

        "Emma marchait dans une forêt lorsqu'elle entendit une cloche. Elle suivit le bruit jusqu'à un arbre immense. Une minuscule porte était cachée dans son tronc.",

        "Lorsque Hugo se réveilla, toute sa ville était vide. Son téléphone s'alluma soudainement. Un message disait : trouve le livre rouge avant minuit.",

        "Trois amis trouvèrent une vieille carte dans le grenier de leur grand-père. Elle indiquait une île qui n'apparaissait sur aucune autre carte.",

        "Zoé trouva dans une bibliothèque un livre sans titre. Lorsqu'elle l'ouvrit, son propre prénom était écrit sur la première page."

    ];



    function lireHistoire() {


        // Choisit un nombre au hasard

        const numero =
            Math.floor(Math.random() * histoires.length);


        // Prend une histoire

        const histoire =
            histoires[numero];


        // Affiche l'histoire

        document.getElementById("histoire").textContent =
            histoire;


        // Arrête l'ancienne voix

        speechSynthesis.cancel();


        // Crée une voix

        const voix =
            new SpeechSynthesisUtterance(histoire);


        voix.lang = "fr-FR";

        voix.rate = 0.9;


        // Commence la lecture

        speechSynthesis.speak(voix);

    }



    function arreter() {

        speechSynthesis.cancel();

    }


</script>


</body>

</html>
